name: Build ImmortalWrt IPK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "package/**"
      - ".github/workflows/build-ipk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # This package contains only Lua, UCI configuration and an init script.
      # It is architecture-independent and has no compiled objects, so building
      # through the SDK unnecessarily builds LuCI C dependencies (which failed
      # on missing lua.h). Assemble a standard legacy OpenWrt IPK directly.
      - name: Build architecture-independent IPK
        shell: bash
        run: |
          set -euxo pipefail
          PKG="luci-app-zash"
          VERSION="1.0.0-1"
          ROOT="$RUNNER_TEMP/ipk-root"
          OUT="$RUNNER_TEMP/ipk-out"
          mkdir -p "$ROOT/etc/config" "$ROOT/etc/init.d" \
            "$ROOT/usr/lib/lua/luci/controller" "$OUT"

          install -m 0644 package/luci-app-zash/files/etc/config/zashboard \
            "$ROOT/etc/config/zashboard"
          install -m 0755 package/luci-app-zash/files/etc/init.d/zashboard-nginx \
            "$ROOT/etc/init.d/zashboard-nginx"
          install -m 0644 package/luci-app-zash/files/usr/lib/lua/luci/controller/zashboard.lua \
            "$ROOT/usr/lib/lua/luci/controller/zashboard.lua"

          mkdir -p "$RUNNER_TEMP/control"
          cat > "$RUNNER_TEMP/control/control" <<'CONTROL'
          Package: luci-app-zash
          Version: 1.0.0-1
          Depends: luci-base, nginx
          Architecture: all
          Section: luci
          Priority: optional
          Maintainer: wfzc6880530
          Description: LuCI shortcut and dedicated Nginx reverse proxy integration for an existing Mihomo/Zashboard UI.
          CONTROL

          printf '2.0\n' > "$RUNNER_TEMP/control/debian-binary"
          tar --format=gnu --numeric-owner --owner=0 --group=0 -czf "$OUT/control.tar.gz" \
            -C "$RUNNER_TEMP/control" control
          tar --format=gnu --numeric-owner --owner=0 --group=0 -czf "$OUT/data.tar.gz" \
            -C "$ROOT" .
          cd "$OUT"
          printf '2.0\n' > debian-binary
          tar --format=gnu --numeric-owner --owner=0 --group=0 -czf "$OUT/${PKG}_${VERSION}_all.ipk" \
            debian-binary control.tar.gz data.tar.gz
          tar -tzf "$OUT/${PKG}_${VERSION}_all.ipk"
          test -s "$OUT/${PKG}_${VERSION}_all.ipk"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-zash-ipk-ipq40xx-generic
          path: ${{ runner.temp }}/ipk-out/luci-app-zash_1.0.0-1_all.ipk
          if-no-files-found: error
          retention-days: 14
