# Standalone Zashboard listener for the LuCI plugin.
# Keep the firmware's existing Nginx :80 server and uhttpd :8080 unchanged.
# Mihomo stays bound to loopback; clients use this same-origin proxy instead.
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    location = / {
        return 302 /zashboard/;
    }

    location ^~ /zashboard/ {
        alias /www/dualweb/zashboard/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /clash {
        return 301 /clash/;
    }

    location ^~ /clash/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
